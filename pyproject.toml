[project]
name = "training-for-tips-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffusers>=0.36.0",
    "transformers>=4.57.6",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "bitsandbytes>=0.49.1",
    "webdataset>=1.0.2",
    "braceexpand>=0.1.7",
    "setuptools>=80.9.0",
    "pandas>=2.3.3",
    "accelerate>=1.12.0",
    "xformers>=0.0.33.post2",
    "jinja2>=3.1.6",
    "ftfy>=6.3.1",
    "datasets>=4.5.0",
    "peft>=0.18.1",
    "wandb>=0.24.0",
    "matplotlib>=3.10.8",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # true로 설정하면 이 index는 명시된 패키지에만 사용됩니다 (안전함)

# 3. 특정 패키지가 위에서 정의한 Index를 사용하도록 매핑
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
xformers = { index = "pytorch-cu130" }
